name: Production Health & API Monitor

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать тесты кнопкой из интерфейса GitHub
  schedule:
    - cron: '*/14 * * * *' # Запуск каждые 14 минут (будильник для Render)

jobs:
  test-live-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytest

      - name: Run live tests
        run: pytest tests/test_live.py -v